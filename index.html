<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grad Ready</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">
<style>
/* Layout: top bar with role switch; app column on the left, presenter notes on the right (stacked on phones).
   Palette: SMU-style navy and indigo, yellow highlight, off-white surfaces, good/warn/risk semantics (see DESIGN.md).
   Type: IBM Plex Sans (headings and body), IBM Plex Mono (clocks and numbers). */
:root {
  --bg: #f7f7f5; --surface: #ffffff; --surface-2: #f2f4fa; --ink: #1b2150; --muted: #5a6070; --line: #e1e4ee;
  --accent: #151c55; --accent-ink: #ffffff; --accent-soft: #e8ecf8; --brand: #3347b0; --yellow: #f2c14e;
  --good: #1d7547; --good-soft: #def2e6; --warn: #85560a; --warn-soft: #fcefcf; --risk: #b3261e; --risk-soft: #fbe2df;
  --cream: #ffffff; --shadow: 0 1px 2px rgba(15,23,32,.04), 0 4px 12px rgba(15,23,32,.06);
  --font-display: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-body: "IBM Plex Sans", "Segoe UI", system-ui, sans-serif;
  --font-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
}
:root { --bezel: #151c55; color-scheme: light; }
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--font-body); font-size: 15px; line-height: 1.5; font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); padding-block: 16px 40px; }
h1, h2, h3 { font-family: var(--font-display); margin: 0; line-height: 1.15; letter-spacing: -0.01em; text-wrap: balance; }
p { margin: 0; }
button, select, input, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
.mono { font-family: var(--font-mono); font-variant-numeric: tabular-nums; }

.shell { max-width: 1120px; margin: 0 auto; display: grid; gap: 16px; }
.topbar { display: flex; flex-wrap: wrap; align-items: center; gap: 12px 16px; justify-content: space-between; }
.brand { display: flex; flex-wrap: wrap; align-items: center; gap: 8px 10px; min-width: 0; }
.brand h1 { white-space: nowrap; }
.brand-mark { width: 34px; height: 34px; border-radius: 9px; background: var(--brand); color: var(--accent-ink); display: grid; place-items: center; flex: none; }
.brand h1 { font-size: 22px; }
.sample { font-size: 12.5px; font-weight: 600; color: var(--warn); background: var(--warn-soft); padding: 3px 8px; border-radius: 99px; }
.seg { display: inline-flex; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 3px; gap: 2px; max-width: 100%; }
.seg button { border: 0; background: transparent; min-height: 40px; padding: 8px 14px; border-radius: 8px; font-weight: 500; color: var(--muted); }
.seg button[aria-pressed="true"], .seg button[aria-selected="true"] { background: var(--accent); color: var(--accent-ink); }

.layout { display: grid; gap: 16px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 960px) { .layout { grid-template-columns: minmax(0, 1fr) 330px; } }

.app { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: clip; min-width: 0; display: flex; flex-direction: column; }
.app-head { padding: 16px 18px 18px; display: grid; gap: 10px; background: var(--accent); color: #fff; }
.app-head .head-top { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.app-head .head-brand { display: flex; align-items: center; gap: 8px; font-weight: 700; font-size: 14.5px; }
.app-head .head-mark { width: 26px; height: 26px; border-radius: 7px; background: var(--brand); display: grid; place-items: center; }
.app-head .head-view { font-size: 11.5px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; color: #aeb6e8; }
.app-head .who { color: #c9cef2; font-size: 13px; }
.app-head h2 { font-size: 26px; font-weight: 800; letter-spacing: -.02em; color: #fff; }
.app-head h2 em { color: var(--yellow); font-style: normal; }
.tabs { display: flex; gap: 4px; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); position: sticky; bottom: 0; z-index: 5; }
.tabs button { flex: 1; border: 0; background: none; min-height: 52px; border-radius: 12px; display: grid; justify-items: center; align-content: center; gap: 2px; font-size: 12.5px; font-weight: 600; color: var(--muted); }
.tabs button[aria-selected="true"] { color: var(--brand); background: var(--accent-soft); }
.body { padding: 18px; display: flex; flex-direction: column; gap: 18px; min-width: 0; flex: 1; }
.body > * { flex: none; min-width: 0; }

.banner { border-radius: 12px; padding: 14px 16px; display: grid; gap: 6px; border-left: 4px solid currentColor; }
.banner h3 { font-size: 17px; }
.banner.warn { background: var(--warn-soft); color: var(--warn); }
.banner.risk { background: var(--risk-soft); color: var(--risk); }
.banner.good { background: var(--good-soft); color: var(--good); }
.banner p { color: var(--ink); }

.sec-title { font-size: 15px; font-weight: 600; color: var(--ink); margin-bottom: 10px; display: flex; justify-content: space-between; align-items: baseline; gap: 4px 12px; flex-wrap: wrap; }
.sec-title span:last-child:not(:first-child) { font-weight: 400; font-size: 13px; color: var(--muted); }
.list { display: grid; gap: 0; border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; background: var(--surface); border-top: 1px solid var(--line); flex-wrap: wrap; }
.row:first-child { border-top: 0; }
.row .main { min-width: 0; flex: 1 1 140px; }
.row .main b { display: block; font-weight: 600; }
.row .main span { color: var(--muted); font-size: 13.5px; }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
.chip::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: currentColor; }
.chip.good { background: var(--good-soft); color: var(--good); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.chip.risk { background: var(--risk-soft); color: var(--risk); }
.chip.info { background: var(--accent-soft); color: var(--brand); }
.chip.plain { background: var(--surface-2); color: var(--muted); }
.progress { height: 10px; background: var(--surface-2); border-radius: 99px; overflow: hidden; margin-top: 8px; }
.progress i { display: block; height: 100%; background: var(--good); border-radius: 99px; }

.btn { border: 1px solid var(--accent); background: var(--accent); color: var(--accent-ink); font-weight: 600; padding: 10px 16px; min-height: 44px; border-radius: 8px; display: inline-flex; align-items: center; justify-content: center; }
.btn:hover:not([disabled]) { filter: brightness(1.08); }
.btn:active:not([disabled]) { transform: translateY(1px); }
.btn.ghost { background: transparent; color: var(--accent); border-width: 1.5px; }
.btn.quiet { background: var(--surface-2); border-color: var(--line); color: var(--ink); }
.btn.danger { background: transparent; border-color: var(--risk); color: var(--risk); }
.btn[disabled] { opacity: .55; cursor: default; }
.actions { display: flex; gap: 8px; flex-wrap: wrap; }

.card { border: 1px solid var(--line); border-radius: 12px; padding: 14px; display: grid; gap: 10px; background: var(--surface); }
.card.hot { border: 1.5px solid var(--accent); background: var(--cream); box-shadow: var(--shadow); }
.clock { font-size: 30px; line-height: 1; }
.clock.late { color: var(--risk); }
.day { display: grid; gap: 0; }
.day-h { font-size: 12.5px; font-weight: 600; color: var(--muted); padding: 8px 14px; background: var(--surface-2); border-top: 1px solid var(--line); }
.day-h:first-child { border-top: 0; }
.clash { background: var(--risk-soft); color: var(--risk); font-size: 13px; padding: 8px 14px; font-weight: 500; }

form { display: grid; gap: 10px; }
label { display: grid; gap: 4px; font-size: 13.5px; font-weight: 600; }
select, input[type="text"], textarea { background: var(--surface); border: 1px solid var(--line); border-radius: 9px; padding: 9px 10px; width: 100%; font-weight: 400; }

.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 10px; }
.kpi { border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px; display: grid; gap: 2px; }
.kpi .v { font-family: var(--font-mono); font-size: 28px; font-weight: 500; }
.kpi .l { font-weight: 600; font-size: 13.5px; }
.kpi .s { color: var(--muted); font-size: 12.5px; }
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; min-width: 520px; font-size: 14px; }
th, td { text-align: left; padding: 10px 12px; border-top: 1px solid var(--line); vertical-align: top; }
thead th { border-top: 0; background: var(--surface-2); font-size: 13px; color: var(--muted); font-weight: 600; }

.notes { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 18px; display: grid; gap: 14px; min-width: 0; }
.notes h2 { font-size: 18px; }
.notes ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; }
.notes .pair { display: grid; gap: 2px; }
.notes .pair small { color: var(--muted); }
.pitch { border-left: 3px solid var(--accent); padding-left: 12px; font-style: italic; color: var(--muted); }
.demo { display: flex; gap: 8px; flex-wrap: wrap; padding-top: 12px; border-top: 1px solid var(--line); }
.foot { color: var(--muted); font-size: 12.5px; max-width: 70ch; }
.empty { color: var(--muted); padding: 14px; text-align: center; }
@media (min-width: 960px) {
  .app.phone { width: 100%; max-width: 410px; margin: 0 auto; border: 9px solid var(--bezel); border-radius: 42px; overflow: hidden;
    height: min(820px, calc(100vh - 120px)); min-height: 600px; box-shadow: 0 0 0 1px var(--line), 0 8px 24px rgba(0, 0, 0, .06); }
  .app.phone .body { overflow-y: auto; }
  .notes { position: sticky; top: 16px; }
}
@media (max-width: 600px) {
  table { min-width: 0; }
  thead { display: none; }
  table, tbody, tr, td { display: block; }
  tr { padding: 10px 12px; border-top: 1px solid var(--line); }
  tr:first-child { border-top: 0; }
  td { border: 0; padding: 1px 0; }
  td:first-child { font-weight: 600; }
  td:nth-child(2)::before { content: "Owner: "; color: var(--muted); }
  td:nth-child(3)::before { content: "Metric: "; color: var(--muted); }
}
.toast { position: fixed; left: 50%; top: calc(12px + env(safe-area-inset-top, 0px)); transform: translateX(-50%); z-index: 50; max-width: calc(100vw - 32px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-weight: 500; box-shadow: 0 8px 24px rgba(0, 0, 0, .25); }
.banner .actions { margin-top: 6px; }
.controls { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; }
.seg.device { display: none; }
@media (min-width: 960px) { .seg.device { display: inline-flex; } }
@media (prefers-reduced-motion: no-preference) {
  .progress i { transition: width .3s; }
  .toast { animation: toast-in .2s ease-out; }
  @keyframes toast-in { from { opacity: 0; transform: translate(-50%, -8px); } to { opacity: 1; transform: translate(-50%, 0); } }
}

/* Distinct task groups on phones and in the phone preview. */
.section-card { padding: 16px; border: 1px solid var(--line); border-radius: 14px; background: var(--surface); }
.next-step { display: grid; gap: 12px; }
.next-step > .sec-title { margin: 0; }
.active-requirements { margin-top: 16px; }
.completed { margin-top: 14px; border-top: 1px solid var(--line); }
summary { cursor: pointer; min-height: 44px; padding: 12px 0; font-weight: 600; font-size: 13px; }
.completed summary span { color: var(--muted); margin-left: 8px; }
.audit-row { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; font-size: 14px; }
.row .main > span { display: block; margin-top: 3px; }
.employers > .list { border: 0; border-radius: 0; gap: 12px; }
.employers .row { border: 1px solid var(--line); border-radius: 10px; align-items: start; }
.employers .row > .btn { flex: 1 0 100%; }
.calendar > .day { border: 0; border-radius: 0; gap: 12px; }
.calendar-day { border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.calendar-day:has(.btn) { border: 1.5px solid var(--accent); }
.calendar .row { gap: 8px; padding: 10px 12px; }
.calendar .row .main { flex-basis: 160px; }
.clash .actions { margin-top: 10px; }
#leave-section form { gap: 16px; }
#leave-section form > p { color: var(--muted); font-size: 13px; }
#leave-section form .btn { width: 100%; }
.presenter-content { display: grid; gap: 14px; padding-top: 12px; }
.presenter-details > summary { padding: 0; display: flex; align-items: center; }
.presenter-details > summary::before { content: '+'; margin-right: 10px; }
.presenter-details[open] > summary::before { content: '−'; }
.app.phone .body { background: var(--bg); padding: 14px; gap: 22px; }
.app.phone .sec-title { align-items: center; }
.app.phone .sec-title > span:first-child { font-size: 14px; }
@media (max-width: 600px) {
  body { margin: 0; padding: 12px 10px 24px; }
  .shell { gap: 14px; }
  .topbar { gap: 12px; }
  .brand h1 { font-size: 20px; }
  .sample { font-size: 11px; background: var(--surface-2); color: var(--muted); }
  .controls, .controls > .seg { width: 100%; }
  .controls > .seg button { flex: 1; padding: 8px; }
  .body { padding: 14px; gap: 22px; background: var(--bg); }
  .app-head { padding: 18px 16px; }
  .section-card { padding: 14px; }
  .sec-title { align-items: center; }
  .sec-title > span:first-child { font-size: 14px; }
  .banner { padding: 14px; gap: 8px; }
  .banner .btn { width: 100%; }
  .banner p { font-size: 14px; }
  .notes { padding: 14px; border-radius: 12px; }
  .foot { font-size: 11px; }
  input[type="text"], select { font-size: 16px; min-height: 44px; }
}
</style>

<div class="shell">
  <header class="topbar">
    <div class="brand">
      <div class="brand-mark" aria-hidden="true">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5"/></svg>
      </div>
      <h1>Grad Ready</h1>
      <span class="sample">Prototype · sample data</span>
    </div>
    <div class="controls">
    <div class="seg device" role="group" aria-label="Preview on">
      <button type="button" data-action="device" data-v="phone" aria-pressed="true">Phone</button>
      <button type="button" data-action="device" data-v="wide" aria-pressed="false">Laptop</button>
    </div>
    <div class="seg" role="group" aria-label="Switch view">
      <button type="button" data-action="role" data-v="student" aria-pressed="true">Student</button>
      <button type="button" data-action="role" data-v="advisor" aria-pressed="false">Advisor</button>
      <button type="button" data-action="role" data-v="mgmt" aria-pressed="false">Management</button>
    </div>
    </div>
  </header>

  <div class="layout">
    <main class="app" id="app"></main>
    <aside class="notes" id="notes" aria-label="Presenter notes"></aside>
  </div>
  <p class="foot">Prototype for the MCRA Week 13 presentation. Every student, employer and figure shown is sample data, not a real record. The real baseline comes from our survey of Year 4 students.</p>
  <div class="sr" id="live" aria-live="polite"></div>
  <div class="toast" id="toast" aria-hidden="true" hidden></div>
</div>

<script>
(function () {
  var H = 3600000;
  var skip = 0;
  function now() { return Date.now() + skip; }
  function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' })[c]; }); }

  function fresh() {
    return {
      role: 'student', tab: 'grad', device: 'phone', seat: null, leave: null, replies: [], intros: {},
      cohort: [
        { id: 'marcus', name: 'Marcus T.', note: 'Demo student', audit: 'unconfirmed', missing: true },
        { id: 'b', name: 'Student B', note: 'Year 4, IS', audit: 'confirmed', missing: false },
        { id: 'c', name: 'Student C', note: 'Year 4, IS', audit: 'unconfirmed', missing: false },
        { id: 'd', name: 'Student D', note: 'Year 4, IS', audit: 'unconfirmed', missing: true },
        { id: 'e', name: 'Student E', note: 'Year 4, IS', audit: 'confirmed', missing: false },
        { id: 'f', name: 'Student F', note: 'Year 4, IS', audit: 'unconfirmed', missing: false }
      ]
    };
  }
  var S = fresh();
  function marcus() { return S.cohort[0]; }
  function atRisk(s) { return s.audit === 'unconfirmed' || s.missing; }

  var EMPLOYERS = [
    { id: 0, name: 'Product analytics team', meta: 'Fintech scale-up (sample)', tag: 'Capstone sponsor · hiring' },
    { id: 1, name: 'Associate product manager', meta: 'E-commerce platform (sample)', tag: 'Product role' },
    { id: 2, name: 'Data analyst, growth team', meta: 'Health-tech start-up (sample)', tag: 'Analytics role' }
  ];

  var WEEK3 = [
    { day: 'Mon', items: [{ t: 'Capstone report due', k: 'Capstone', w: '17:00' }] },
    { day: 'Wed', items: [{ t: 'Online assessment, Employer A', k: 'Assessment', w: '3-hour window' }] },
    { day: 'Thu', items: [{ t: 'Capstone sprint demo', k: 'Capstone', w: '14:00' }, { t: 'Online assessment, Employer B', k: 'Assessment', w: 'due 23:59' }],
      clash: 'Workload clash · demo + assessment' },
    { day: 'Fri', items: [{ t: 'Team presentation', k: 'Coursework', w: '10:00' }, { t: 'Final-round interview, Employer C', k: 'Interview', w: '10:00' }],
      leave: true, clash: 'Time clash · interview + presentation' }
  ];

  var NOTES = {
    'student-grad': {
      title: 'Why this screen exists',
      pairs: [
        ['Requirements spread across 5 portals', 'One page: done, in progress, missing.'],
        ['Late audit in the final term (worst moment, -2)', 'Early warning in Week 1-3, with a confirmed audit by Week 3.'],
        ['Needed module full in BOSS', 'Request a reserved seat; the advisor approves.']
      ],
      metric: 'Share of audits confirmed by Week 3'
    },
    'student-career': {
      title: 'Why the Career tab exists',
      pairs: [
        ['Career fair is mostly banks', 'Intros to 3+ product and analytics employers, incl. capstone sponsors who are hiring.'],
        ['Assessments pile up during project deadlines', 'One calendar with clashes flagged.'],
        ['No rule on interview absences', 'Interview-leave request with a 48-hour reply countdown.']
      ],
      metric: 'Interview-leave reply time; intros per student'
    },
    advisor: {
      title: 'Why the advisor view exists',
      pairs: [
        ['Advisor replies take about a week', 'At-risk students first, and a 48-hour clock on every request.'],
        ['Audits confirmed late', 'Confirm each audit by Week 3 from the same list.']
      ],
      metric: 'Average reply time; audits confirmed by Week 3'
    },
    mgmt: {
      title: 'Why management gets a view',
      pairs: [
        ['No one sees the risk early', 'Students at risk, in one number.'],
        ['Success is hard to prove', 'Reply time and requirements on track give our success metrics.']
      ],
      metric: 'Students at risk; average reply time; requirements on track'
    }
  };

  function chip(kind, text) { return '<span class="chip ' + kind + '">' + esc(text) + '</span>'; }

  function clock(deadline) {
    return '<span class="mono clock" data-countdown="' + deadline + '">--:--:--</span>';
  }
  function fmtClock(ms) {
    var late = ms < 0, a = Math.abs(ms), h = Math.floor(a / H), m = Math.floor(a % H / 60000), s = Math.floor(a % 60000 / 1000);
    function p(n) { return (n < 10 ? '0' : '') + n; }
    return (late ? 'Overdue ' : '') + p(h) + ':' + p(m) + ':' + p(s);
  }

  /* ---------- Student ---------- */
  function reqList() {
    var m = marcus();
    var seat = S.seat && S.seat.status === 'approved';
    var rows = [
      { n: 'University core', d: 'All modules complete', st: 'done' },
      { n: 'Programme core', d: 'All modules complete', st: 'done' },
      { n: 'Capstone project', d: 'Showcase this term', st: 'prog' },
      { n: 'Analytics elective', d: seat ? 'Seat reserved' : '1 module needed · BOSS full', st: seat ? 'prog' : 'missing' },
      { n: 'Free electives', d: 'Complete', st: 'done' },
      { n: 'Internship credit', d: 'Complete', st: 'done' }
    ];
    return rows;
  }
  function studentGrad() {
    var m = marcus(), rows = reqList();
    var done = rows.filter(function (r) { return r.st === 'done'; }).length;
    var missing = rows.filter(function (r) { return r.st === 'missing'; }).length;
    var prog = rows.length - done - missing;
    var auditOk = m.audit === 'confirmed';
    var banner;
    if (!auditOk && missing) {
      banner = '<div class="banner risk"><h3>1 module needs attention</h3><p>Analytics elective is full. Request a seat before Week 3.</p></div>';
    } else if (!auditOk) {
      banner = '<div class="banner warn"><h3>Seat secured. Audit pending.</h3><p>Your advisor will confirm your audit by Week 3.</p></div>';
    } else if (missing) {
      banner = '<div class="banner warn"><h3>Audit confirmed · 1 module missing</h3><p>Reserve your Analytics elective seat.</p></div>';
    } else {
      banner = '<div class="banner good"><h3>On track to graduate</h3><p>Audit confirmed. No missing requirements.</p></div>';
    }
    var canAsk = missing && (!S.seat || S.seat.status === 'declined');
    if (canAsk) {
      banner = banner.replace(/<\/div>$/, '<div class="actions"><button type="button" class="btn" data-action="seat-request">Request seat</button></div></div>');
    }
    var seatBlock = '';
    if (missing) {
      if (S.seat && S.seat.status === 'declined') {
        seatBlock = '<p>Meet your advisor, then request again.</p>';
      } else if (!canAsk) {
        seatBlock = '<div class="card hot"><div><b>Seat request pending</b></div><div class="mono">Reply due in</div>' + clock(S.seat.at + 48 * H) + '</div>';
      }
    }
    function requirement(r) {
      var c = r.st === 'done' ? chip('good', 'Done') : r.st === 'prog' ? chip('info', 'In progress') : chip('risk', 'Missing');
      return '<div class="row"><div class="main"><b>' + esc(r.n) + '</b>' + (r.st === 'done' ? '' : '<span>' + esc(r.d) + '</span>') + '</div>' + c + '</div>';
    }
    return '<section class="next-step"><div class="sec-title"><span>Your next step</span><span>Audit due Week 3</span></div>' + banner + seatBlock + '</section>' +
      '<section class="section-card"><div class="sec-title"><span>Requirements</span><span>' + done + ' of ' + rows.length + ' complete</span></div>' +
      '<div class="progress" role="img" aria-label="' + done + ' of ' + rows.length + ' requirements done"><i style="width:' + Math.round(done / rows.length * 100) + '%"></i></div>' +
      '<div class="list active-requirements">' + rows.filter(function(r) { return r.st !== 'done'; }).sort(function(a,b) { return (a.st === 'missing' ? -1 : 0) - (b.st === 'missing' ? -1 : 0); }).map(requirement).join('') + '</div>' +
      '<details class="completed"><summary>Completed requirements <span>' + done + '</span></summary><div class="list">' + rows.filter(function(r) { return r.st === 'done'; }).map(requirement).join('') + '</div></details></section>' +
      '<section class="section-card"><div class="sec-title"><span>Advisor audit</span><span>Due Week 3</span></div><div class="audit-row"><b>Graduation audit</b>' +
      (auditOk ? chip('good', 'Confirmed') : chip('warn', 'Pending')) + '</div></section>';
  }

  function studentCareer() {
    var intros = Object.keys(S.intros).length;
    var out = '<section class="section-card employers"><div class="sec-title"><span>01 · Employer matches</span><span>' + intros + ' of 3 intros requested</span></div><div class="list">' +
      EMPLOYERS.map(function (e) {
        var on = !!S.intros[e.id];
        return '<div class="row"><div class="main"><b>' + esc(e.name) + '</b><span>' + esc(e.meta) + '</span>' + (e.id === 0 ? '<span>Alumni mentor support</span>' : '') + (on ? '<span>Intro pending with SCIS</span>' : '') + '<div style="margin-top:6px">' + chip(e.id === 0 ? 'good' : 'info', e.tag) + '</div></div>' +
          '<button type="button" class="btn ' + (on ? 'quiet' : 'ghost') + '" data-action="intro" data-v="' + e.id + '" aria-pressed="' + on + '">' + (on ? 'Cancel request' : 'Request intro') + '</button></div>';
      }).join('') + '</div></section>';

    out += '<section class="section-card calendar"><div class="sec-title"><span>02 · Your deadlines</span><span>Week 3 · 2 clashes</span></div><div class="list day">' +
      WEEK3.map(function (d) {
        return '<div class="calendar-day"><div class="day-h">' + d.day + '</div>' + d.items.map(function (i) {
          return '<div class="row"><div class="main"><b>' + esc(i.t) + '</b><span>' + esc(i.w) + '</span></div>' + chip(i.k === 'Assessment' || i.k === 'Interview' ? 'warn' : i.k === 'Capstone' ? 'info' : 'plain', i.k) + '</div>';
        }).join('') + (d.clash ? '<div class="clash">' + esc(d.clash) + (d.leave ? '<div class="actions"><button type="button" class="btn ghost" data-action="leave-clash">Request leave</button></div>' : '') + '</div>' : '') + '</div>';
      }).join('') + '</div></section>';

    var L = S.leave, form;
    if (!L || L.status === 'declined') {
      form = (L ? '<p>Your advisor declined the request. You can send a new one.</p>' : '') +
        '<form id="leave-form"><p>Ask to reschedule a graded activity.</p><label for="leave-activity">Clashing activity<select id="leave-activity"><option>Team presentation · Fri 10:00</option><option>Capstone demo · Thu 14:00</option></select></label>' +
        '<label for="leave-employer">Interview with<input type="text" id="leave-employer" required maxlength="120" value="Employer C (sample)"></label>' +
        '<div class="actions"><button type="submit" class="btn">Send request</button></div></form>';
    } else if (L.status === 'pending') {
      form = '<div class="card hot"><b>Request sent</b><span>' + esc(L.activity) + '</span><span>' + esc(L.employer) + '</span><div class="mono">Reply due in</div>' + clock(L.at + 48 * H) + '</div>';
    } else {
      form = '<div class="banner good"><h3>Approved</h3><p>Your advisor approved the interview leave for: ' + esc(L.activity) + ' Interview: ' + esc(L.employer) + '.</p></div>';
    }
    out += '<section class="section-card" id="leave-section"><div class="sec-title"><span>03 · Interview leave</span><span>48-hour reply</span></div>' + form + '</section>';
    return out;
  }

  /* ---------- Advisor ---------- */
  function advisorView() {
    var pend = [];
    if (S.seat && S.seat.status === 'pending') pend.push({ k: 'seat', t: 'Reserved seat: Analytics elective', who: 'Marcus T.', at: S.seat.at });
    if (S.leave && S.leave.status === 'pending') pend.push({ k: 'leave', t: 'Interview leave: ' + S.leave.employer + ' · ' + S.leave.activity, who: 'Marcus T.', at: S.leave.at });
    var risky = S.cohort.slice().sort(function (a, b) { return (atRisk(b) ? 1 : 0) - (atRisk(a) ? 1 : 0); });
    var toConfirm = S.cohort.filter(function (s) { return s.audit === 'unconfirmed'; }).length;
    return '<div class="kpis"><div class="kpi"><span class="v">' + pend.length + '</span><span class="l">Requests waiting</span><span class="s">48-hour clock on each</span></div>' +
      '<div class="kpi"><span class="v">' + toConfirm + '</span><span class="l">Audits to confirm</span><span class="s">Due by Week 3</span></div></div>' +
      '<section><div class="sec-title"><span>Requests</span></div>' +
      (pend.length ? '<div class="list">' + pend.map(function (p) {
        return '<div class="row"><div class="main"><b>' + esc(p.t) + '</b><span>' + esc(p.who) + ' · reply due in </span>' + '<span class="mono" data-countdown="' + (p.at + 48 * H) + '" data-inline="1">--:--:--</span></div>' +
          '<div class="actions"><button type="button" class="btn" data-action="approve" data-v="' + p.k + '">Approve</button><button type="button" class="btn danger" data-action="decline" data-v="' + p.k + '">Decline</button></div></div>';
      }).join('') + '</div>' : '<div class="list"><div class="empty">No requests waiting. In the Student view, request a seat or interview leave to see one here.</div></div>') + '</section>' +
      '<section><div class="sec-title"><span>Students, at risk first</span></div><div class="list">' + risky.map(function (s) {
        var tags = [];
        if (s.audit === 'unconfirmed') tags.push(chip('warn', 'Audit unconfirmed'));
        if (s.missing) tags.push(chip('risk', 'Requirement missing'));
        if (!tags.length) tags.push(chip('good', 'On track'));
        return '<div class="row"><div class="main"><b>' + esc(s.name) + '</b><span>' + esc(s.note) + '</span><div style="margin-top:6px;display:flex;gap:6px;flex-wrap:wrap">' + tags.join('') + '</div></div>' +
          (s.audit === 'unconfirmed' ? '<button type="button" class="btn ghost" data-action="confirm" data-v="' + s.id + '">Confirm audit</button>' : '') + '</div>';
      }).join('') + '</div></section>';
  }

  /* ---------- Management ---------- */
  function avgReply() {
    if (!S.replies.length) return null;
    return S.replies.reduce(function (a, b) { return a + b; }, 0) / S.replies.length;
  }
  function mgmtView() {
    var n = S.cohort.length;
    var risk = S.cohort.filter(atRisk).length;
    var conf = S.cohort.filter(function (s) { return s.audit === 'confirmed'; }).length;
    var onTime = S.cohort.filter(function (s) { return !s.missing; }).length;
    var avg = avgReply();
    var avgTxt = avg === null ? '--' : (avg < 1 ? '< 1 h' : (Math.round(avg * 10) / 10) + ' h');
    return '<div class="kpis">' +
      '<div class="kpi"><span class="v">' + risk + '</span><span class="l">Students at risk</span><span class="s">of ' + n + ' in sample cohort</span></div>' +
      '<div class="kpi"><span class="v">' + conf + '/' + n + '</span><span class="l">Audits confirmed</span><span class="s">Target: all by Week 3</span></div>' +
      '<div class="kpi"><span class="v">' + avgTxt + '</span><span class="l">Average advisor reply</span><span class="s">Baseline about 1 week. Target 48 h.</span></div>' +
      '<div class="kpi"><span class="v">' + Math.round(onTime / n * 100) + '%</span><span class="l">Requirements on track</span><span class="s">No missing requirements · sample cohort</span></div></div>' +
      '<section><div class="sec-title"><span>Who owns each fix (suggested)</span></div><div class="tbl-wrap"><table><thead><tr><th>Fix</th><th>Owner</th><th>Success metric</th></tr></thead><tbody>' +
      '<tr><td>Audit confirmed by Week 3</td><td>Registrar and advisors</td><td>% audits confirmed by Week 3</td></tr>' +
      '<tr><td>Reserved seats for graduating students</td><td>Registrar</td><td>Students blocked by a full module</td></tr>' +
      '<tr><td>Interview-leave form, 48-hour reply</td><td>Career centre and faculty</td><td>Average reply time</td></tr>' +
      '<tr><td>Hiring sponsors and alumni mentors</td><td>Capstone office</td><td>Interview invites from showcases</td></tr>' +
      '</tbody></table></div></section>';
  }

  /* ---------- Render ---------- */
  function render() {
    var key = S.role === 'student' ? 'student-' + S.tab : S.role;
    var who = S.role === 'student' ? 'Marcus · Year 4 / T1 / W1' : S.role === 'advisor' ? 'Academic advisor · Term 1 · Week 1' : 'SCIS management · sample cohort';
    var title = S.role === 'student' ? (S.tab === 'grad' ? 'Graduation' : 'Career') : S.role === 'advisor' ? 'Advisor inbox' : 'Programme health';
    var headline = S.role === 'student' ? (S.tab === 'grad' ? 'No more grad audit <em>surprises</em>' : 'See clashes <em>before</em> they hit') : S.role === 'advisor' ? 'Reply in <em>48 hours</em>' : 'Spot risk <em>early</em>';
    var tabs = S.role === 'student'
      ? '<div class="tabs" role="tablist" aria-label="Sections">' +
        '<button type="button" role="tab" data-action="tab" data-v="grad" aria-selected="' + (S.tab === 'grad') + '"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5"/></svg>Graduation</button>' +
        '<button type="button" role="tab" data-action="tab" data-v="career" aria-selected="' + (S.tab === 'career') + '"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="3" y="7" width="18" height="13" rx="2"/><path d="M9 7V5a2 2 0 0 1 2-2h2a2 2 0 0 1 2 2v2"/><path d="M3 13h18"/></svg>Career</button></div>'
      : '';
    var body = S.role === 'student' ? (S.tab === 'grad' ? studentGrad() : studentCareer()) : S.role === 'advisor' ? advisorView() : mgmtView();
    document.getElementById('app').innerHTML = '<div class="app-head"><div class="head-top"><span class="head-brand"><span class="head-mark" aria-hidden="true"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l9-5 9 5-9 5-9-5z"/><path d="M7 11.5V16c0 1.5 2.2 3 5 3s5-1.5 5-3v-4.5"/></svg></span>Grad Ready</span><span class="head-view">' + esc(title) + '</span></div><h2>' + headline + '</h2><span class="who">' + esc(who) + '</span></div>' + '<div class="body">' + body + '</div>' + tabs;
    var phoneMode = S.device === 'phone';
    document.getElementById('app').className = 'app' + (phoneMode ? ' phone' : '');
    document.querySelectorAll('[data-action="device"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === (phoneMode ? 'phone' : 'wide'))); });

    var N = NOTES[key];
    document.getElementById('notes').innerHTML = '<details class="presenter-details"><summary>Presenter guide & demo controls</summary><div class="presenter-content"><h2>' + esc(N.title) + '</h2>' +
      N.pairs.map(function (p) { return '<div class="pair"><b>' + esc(p[0]) + '</b><small>' + esc(p[1]) + '</small></div>'; }).join('') +
      '<div class="pair"><b>Metric it gives us</b><small>' + esc(N.metric) + '</small></div>' +
      '<div class="pair"><b>Demo path · about 30 seconds</b><small>Student: request seat → Advisor: approve seat, then confirm Marcus’s audit → Management: show updated metrics → Student Career: show interview clash.</small></div>' +
      '<p class="pitch">Grad Ready gets Marcus through both of his biggest risks: not graduating, and not getting hired.</p>' +
      '<div class="demo"><button type="button" class="btn quiet" data-action="skip">Skip 24 hours (demo)</button><button type="button" class="btn quiet" data-action="reset">Reset demo</button></div></div></details>';

    document.querySelectorAll('[data-action="role"]').forEach(function (b) { b.setAttribute('aria-pressed', String(b.getAttribute('data-v') === S.role)); });
    tick();
  }

  function tick() {
    document.querySelectorAll('[data-countdown]').forEach(function (el) {
      var ms = Number(el.getAttribute('data-countdown')) - now();
      el.textContent = fmtClock(ms);
      el.classList.toggle('late', ms < 0);
    });
  }
  setInterval(tick, 1000);

  var toastTimer;
  function say(t) {
    document.getElementById('live').textContent = t;
    var el = document.getElementById('toast');
    el.textContent = t; el.hidden = false;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.hidden = true; }, 2600);
  }
  function reply(at) { S.replies.push((now() - at) / H); }

  document.addEventListener('click', function (e) {
    var t = e.target.closest('[data-action]');
    if (!t) return;
    var a = t.getAttribute('data-action'), v = t.getAttribute('data-v');
    if (a === 'role') { S.role = v; }
    else if (a === 'device') { S.device = v; }
    else if (a === 'tab') { S.tab = v; }
    else if (a === 'seat-request') { S.seat = { at: now(), status: 'pending' }; say('Seat request pending.'); }
    else if (a === 'leave-clash') {
      var form = document.getElementById('leave-form');
      if (form) { document.getElementById('leave-activity').selectedIndex = 0; form.scrollIntoView({ block: 'center' }); document.getElementById('leave-employer').focus({ preventScroll: true }); }
      else { document.getElementById('leave-section').scrollIntoView({ block: 'center' }); say('Your interview-leave request is already ' + S.leave.status + '.'); }
      return;
    }
    else if (a === 'intro') { if (S.intros[v]) { delete S.intros[v]; say('Intro cancelled.'); } else { S.intros[v] = true; say('Intro requested. SCIS will reach out.'); } }
    else if (a === 'confirm') { var s = S.cohort.filter(function (x) { return x.id === v; })[0]; if (s) s.audit = 'confirmed'; say('Audit confirmed.'); }
    else if (a === 'approve') {
      if (v === 'seat' && S.seat) { S.seat.status = 'approved'; reply(S.seat.at); marcus().missing = false; }
      if (v === 'leave' && S.leave) { S.leave.status = 'approved'; reply(S.leave.at); }
      say(v === 'seat' && marcus().audit !== 'confirmed' ? 'Seat approved. Confirm Marcus’s audit next.' : 'Request approved.');
    }
    else if (a === 'decline') {
      if (v === 'seat' && S.seat) { S.seat.status = 'declined'; reply(S.seat.at); }
      if (v === 'leave' && S.leave) { S.leave.status = 'declined'; reply(S.leave.at); }
      say('Request declined.');
    }
    else if (a === 'skip') { skip += 24 * H; }
    else if (a === 'reset') { var r = S.role, tb = S.tab, dv = S.device; S = fresh(); S.role = r; S.tab = tb; S.device = dv; skip = 0; say('Demo reset.'); }
    render();
    var again = document.querySelector('[data-action="' + a + '"]' + (v !== null ? '[data-v="' + v + '"]' : ''));
    if (again && a !== 'skip' && a !== 'reset') again.focus({ preventScroll: true });
  });

  document.addEventListener('submit', function (e) {
    if (e.target.id !== 'leave-form') return;
    e.preventDefault();
    var act = document.getElementById('leave-activity').value;
    S.leave = { at: now(), status: 'pending', activity: act, employer: document.getElementById('leave-employer').value.trim() || 'Employer C (sample)' };
    say('Interview-leave request sent. Reply due within 48 hours.');
    render();
  });

  render();
})();
</script>

</html>
